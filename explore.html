<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><title>Explore the World — Meanwhile in History</title>
<meta name="description" content="Explore countries and capitals on a seamless map, from the whole world to the streets of Monaco.">
</head>
<body>
<header class="explore-header"><a href="/" class="brand">MEANWHILE IN HISTORY</a><nav aria-label="Main navigation"><a href="/civilizations">CIVILIZATIONS</a><a href="/explore" aria-current="page">EXPLORE</a><a href="/quiz">QUIZ</a></nav></header>
<main id="explore-main">
<div id="explore-map" aria-label="World map. Drag to pan, scroll or pinch to zoom. Arrow keys pan; plus and minus zoom."></div>
<section class="search-panel" aria-label="Country search">
<form id="search-form" role="search"><label for="explore-search" class="sr-only">Find a country or capital</label><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="explore-search" type="search" placeholder="Search a country or capital" autocomplete="off" aria-controls="explore-results"><button id="search-clear" type="button" aria-label="Clear search">×</button></form>
<div id="search-dropdown" hidden><p id="search-count" role="status"></p><div id="explore-results"></div></div>
</section>
<section id="place-card" class="place-card" aria-label="Selected country" hidden><button id="close-place">Dismiss</button><h1 id="place-name"></h1><p id="place-capital" aria-live="polite"></p><p id="place-population"></p></section>
<div class="capital-key"><span aria-hidden="true">●</span> Capital city</div>
<div class="map-credits">© <a href="https://openfreemap.org/" target="_blank" rel="noreferrer">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a></div>
<div id="map-message" role="status">Loading the world…</div>
<div id="hover-label" role="status" hidden></div>
</main>
<script type="module" src="/src/explore-page.ts"></script>
</body></html>
